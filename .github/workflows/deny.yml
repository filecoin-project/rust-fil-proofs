# Runs `cargo-deny` against the workspace: advisories, licences, bans and sources.
# Configuration lives in deny.toml.
name: Cargo Deny
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
      with:
        rust-version: "1.99.1"
